<body class="bg-slate-100 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-700 to-sky-500 text-white p-4 shadow">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold tracking-wide">Wireless Emergency Telemedicine System</h1>
        <p class="text-xs opacity-90">Remote Healthcare Monitoring</p>
      </div>
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-700 font-bold">W</div>
    </div>
  </header>

  <main class="flex-grow p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b border-slate-200 bg-slate-50">
        <button class="px-6 py-3 text-sm font-semibold text-blue-700 border-b-2 border-blue-600 bg-white">Personal Information</button>
        <button class="px-6 py-3 text-sm font-medium text-slate-500 hover:text-slate-700">Patient Contact Person</button>
      </div>

      <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Form Area -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Personal Info Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">National ID</label>
              <input type="text" value="08050852601333" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">First name</label>
              <input type="text" value="osama" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Gender</label>
              <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Last name</label>
              <input type="text" value="elnahas" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile</label>
              <input type="text" value="0201001069970" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Telephone</label>
              <input type="text" value="088256479" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail</label>
              <input type="email" value="osamaelnahhas@gmail.com" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Age</label>
              <input type="number" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Department</label>
              <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>internists</option>
                <option>cardiac</option>
                <option>Orthopedics</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Marital status</label>
              <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>Married</option>
                <option>Single</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Date of Birth</label>
              <input type="date" value="2013-09-11" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Blood type</label>
              <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>O-</option>
                <option>A+</option>
                <option>B+</option>
                <option>AB+</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Doctor</label>
              <select class="w-full md:w-1/2 border border-slate-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>DR.Mohamed</option>
                <option>DR.Ahmed</option>
              </select>
            </div>
          </div>

          <!-- Address Info -->
          <div class="border-t border-slate-200 pt-4">
            <h4 class="text-sm font-bold text-slate-700 mb-3">Address Information</h4>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Country</label>
                <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"><option>Egypt</option></select>
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Governorate</label>
                <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"><option>Assiut</option></select>
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">City</label>
                <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"><option>Assiut</option></select>
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Village</label>
                <input type="text" value="Assiut" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Nationality</label>
                <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"><option>Egyptian</option></select>
              </div>
              <div>
                <label class="block text-xs text-slate-500 mb-1">Street</label>
                <input type="text" value="takssem elyosfe" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" />
              </div>
            </div>
          </div>
        </div>

        <!-- Right Side: Photo & Contact -->
        <div class="space-y-6">
          <div class="border border-slate-200 rounded-lg p-4 text-center">
            <h4 class="text-sm font-semibold text-slate-700 mb-3">Personal Photo</h4>
            <div class="w-32 h-40 bg-slate-100 border-2 border-dashed border-slate-300 rounded-lg mx-auto flex items-center justify-center mb-3">
              <span class="text-xs text-slate-400">No image</span>
            </div>
            <button class="bg-blue-100 text-blue-700 text-xs font-semibold px-4 py-2 rounded hover:bg-blue-200 transition">Import</button>
          </div>

          <div class="border border-slate-200 rounded-lg p-4">
            <h4 class="text-sm font-semibold text-slate-700 mb-3">Patient Contact</h4>
            <div class="space-y-3">
              <div>
                <label class="block text-xs text-slate-500 mb-1">Type</label>
                <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white"><option>Fax</option><option>Mobile</option><option>Email</option></select>
              </div>
              <div class="flex gap-2">
                <input type="text" value="088256987" class="flex-1 border border-slate-300 rounded-md px-3 py-2 text-sm" />
                <button class="bg-blue-600 text-white text-xs px-3 py-2 rounded hover:bg-blue-700">Add</button>
              </div>
              <ul class="text-xs text-slate-600 space-y-1 mt-2">
                <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>Mobile</li>
                <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>Email</li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="p-6 border-t border-slate-200 bg-slate-50 flex justify-center gap-4">
        <button class="bg-slate-300 hover:bg-slate-400 text-slate-700 font-medium px-8 py-2 rounded-lg transition">Clear</button>
        <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-8 py-2 rounded-lg transition">Save</button>
      </div>
    </div>
  </main>

  <footer class="bg-slate-200 text-center text-xs text-slate-600 py-3">
    Developed in CS Department, Faculty of Science, Rivers State Univerisity, June 2026
  </footer>
