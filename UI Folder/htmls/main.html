<body class="bg-slate-100 min-h-screen flex flex-col">
  <!-- Top Bar -->
  <nav class="bg-white shadow-sm border-b border-slate-200 px-6 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-sm">W</div>
        <span class="font-bold text-slate-800">Wireless Emergency Telemedicine System</span>
      </div>
      <div class="flex gap-2">
        <button class="text-sm px-3 py-1 rounded hover:bg-slate-100 text-slate-600">Menu</button>
        <button class="text-sm px-3 py-1 rounded hover:bg-slate-100 text-slate-600">Help</button>
      </div>
    </div>

    <div class="text-center mb-12">
      <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-2">

      </h1>
      <p class="text-slate-400 text-lg tracking-widest uppercase">Remote Healthcare Monitoring</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-5xl">
      <!-- Card 1 -->
      <a href="#" class="bg-white rounded-xl shadow-md hover:shadow-xl transition p-6 flex flex-col items-center border-t-4 border-blue-500 group">
        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 group-hover:bg-blue-100 transition">
          <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM4 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 10.374 21c-2.331 0-4.512-.645-6.374-1.766Z" /></svg>

      </a>

      <!-- Card 2 -->
      <a href="#" class="bg-white rounded-xl shadow-md hover:shadow-xl transition p-6 flex flex-col items-center border-t-4 border-sky-500 group">
        <div class="w-16 h-16 bg-sky-50 rounded-full flex items-center justify-center mb-4 group-hover:bg-sky-100 transition">
          <svg class="w-8 h-8 text-sky-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
        </div>
        <span class="font-semibold text-slate-700">Find Patient</span>
      </a>

      <!-- Card 3 -->
      <a href="#" class="bg-white rounded-xl shadow-md hover:shadow-xl transition p-6 flex flex-col items-center border-t-4 border-emerald-500 group">
        <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mb-4 group-hover:bg-emerald-100 transition">
          <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>
        </div>
        <span class="font-semibold text-slate-700">Patient Connection</span>

      <!-- Card 4 -->
      <a href="#" class="bg-white rounded-xl shadow-md hover:shadow-xl transition p-6 flex flex-col items-center border-t-4 border-teal-500 group">
        <div class="w-16 h-16 bg-teal-50 rounded-full flex items-center justify-center mb-4 group-hover:bg-teal-100 transition">
          <svg class="w-8 h-8 text-teal-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" /></svg>

  <footer class="bg-slate-200 text-center text-xs text-slate-600 py-3">
